# games.trybest.com.br: só a lista de jogos (estática). Cada jogo tem o
# próprio subdomínio, servido pelo nginx do jogo (deploy/local/docker-compose.prd.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'" always;

    # A lista sempre revalida (um jogo novo aparece no reload). `expires`, e não
    # add_header: um add_header aqui apagaria os de cima neste location.
    location = /index.html {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
