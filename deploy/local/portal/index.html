<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogos · TryBest</title>
  <meta name="description" content="Jogos da TryBest para jogar no navegador, no PC ou no celular.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --ouro: #F2C230;
      --carvao: #17181A;
      --grafite: #242528;
      --branco: #F5F5F5;
      --cinza: #A3A4A8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--carvao);
      color: var(--branco);
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header, main, footer { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 32px; }
    header a { display: inline-block; }
    header img { height: 36px; display: block; }
    h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -0.03em; margin: 48px 0 8px; }
    .sub { color: var(--cinza); margin: 0 0 32px; font-size: 17px; }
    main { flex: 1; }
    .jogos { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .jogo {
      display: flex; gap: 16px; align-items: center;
      padding: 16px; border-radius: 16px;
      background: var(--grafite); color: inherit; text-decoration: none;
      border: 2px solid transparent;
      transition: border-color .15s, transform .15s;
    }
    .jogo:hover, .jogo:focus-visible { border-color: var(--ouro); transform: translateY(-2px); outline: none; }
    .jogo img { width: 72px; height: 72px; border-radius: 14px; flex: none; }
    .jogo strong { display: block; font-size: 19px; margin-bottom: 4px; }
    .jogo span { color: var(--cinza); font-size: 14px; line-height: 1.4; }
    .jogo .jogar { display: inline-block; margin-top: 8px; color: var(--ouro); font-weight: 700; font-size: 14px; }
    footer { padding: 32px 16px; color: var(--cinza); font-size: 13px; }
    footer a { color: var(--cinza); }
  </style>
</head>
<body>
  <header>
    <a href="https://trybest.com.br" aria-label="TryBest"><img src="/logo.svg" alt="TryBest"></a>
  </header>
  <main>
    <h1>Jogos</h1>
    <p class="sub">Direto no navegador, no PC ou no celular.</p>
    <ul class="jogos">
      <!-- Um <li> por jogo; o endereço é o subdomínio dele (cada jogo publica o seu pelo próprio túnel). -->
      <li>
        <a class="jogo" href="https://offensive-combat.trybest.com.br">
          <img src="/offensive-combat.svg" alt="">
          <div>
            <strong>Offensive Combat</strong>
            <span>Tiro em primeira pessoa: treino, bots e partidas online.</span>
            <span class="jogar">Jogar →</span>
          </div>
        </a>
      </li>
    </ul>
  </main>
  <footer><a href="https://trybest.com.br">trybest.com.br</a></footer>
</body>
</html>
