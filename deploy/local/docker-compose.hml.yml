# HOMOLOGAÇÃO local do Offensive Combat — a mesma máquina da produção, pilha
# separada, em offensive-combat-hml.trybest.com.br. Recebe só as rc
# (alpha-0.2.0.rc.003, da branch homolog); a produção só recebe versão final.
#
# ⚠️ **Arquivo próprio, e não o da produção com variáveis.** Projeto
# (`offensive-hml`), volumes (`offensive-hml-*`), segredos (HML_DIR) e túnel
# são todos outros: um compose compartilhado que esquecesse de trocar UM nome
# apontaria a homologação para o banco da produção.
#
# Quem sobe isto é o OffensiveTunel.exe ("Ligar homologação" na bandeja, ou um
# deploy de hml pela API). Sem a página games.trybest.com.br: ela é da produção.

name: offensive-hml

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  banco:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oc
      POSTGRES_PASSWORD: ${PG_SENHA:?defina PG_SENHA no .env.hml}
      POSTGRES_DB: oc
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oc -d oc"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *log

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env.hml}
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *log

  jogo:
    image: offensive-hml-jogo:${VERSAO:-latest}
    build:
      context: ${JOGO_CONTEXT:?defina JOGO_CONTEXT}
      target: server
      args:
        APP_VERSION: ${VERSAO:-dev}
    restart: unless-stopped
    depends_on:
      banco: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: ["${HML_DIR:?defina HML_DIR}/.env.hml"]
    environment:
      APP_VERSION: ${VERSAO:-dev}
      MAPAS_DIR: /app/dados/mapas
    volumes:
      - mapas:/app/dados/mapas
    networks: [borda, interna]
    <<: *log

  web:
    image: offensive-hml-web:${VERSAO:-latest}
    build:
      context: ${JOGO_CONTEXT}
      target: web
      args:
        APP_VERSION: ${VERSAO:-dev}
    restart: unless-stopped
    depends_on: [jogo]
    volumes:
      - ./realip.conf:/etc/nginx/conf.d/00-realip.conf:ro
    networks: [borda]
    <<: *log

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${HML_DIR}/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${HML_DIR}/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on: [web]
    networks: [borda]
    <<: *log

networks:
  borda: {}
  interna:
    internal: true

volumes:
  pgdata:
    external: true
    name: offensive-hml-pgdata
  mapas:
    external: true
    name: offensive-hml-mapas
