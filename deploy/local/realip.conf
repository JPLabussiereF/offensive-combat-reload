# Montado em /etc/nginx/conf.d/ do nginx do Offensive Combat (nível http).
#
# ⚠️ Sem isto, todo jogador parece vir do IP do cloudflared: o nginx do jogo
# anexa o $remote_addr (o cloudflared) ao X-Forwarded-For, e o servidor do jogo
# lê o ÚLTIMO endereço — o rate limit e o bloqueio por senha errada virariam um
# balde só para todo mundo. Com o real_ip, $remote_addr passa a ser o jogador
# (o CF-Connecting-IP que a Cloudflare põe em cada request), e é ele que vai
# no fim do X-Forwarded-For e nas zonas de limit_req do próprio nginx.
#
# Confiar na rede do Docker é seguro AQUI: este nginx não tem porta publicada;
# só o cloudflared (rede `borda` da pilha) fala com ele.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header CF-Connecting-IP;
