# Copie para tunel.ini (ao lado do OffensiveTunel.exe) e ajuste.

# O clone deste repositório (de onde saem as tags e o git archive de cada versão).
JOGO_DIR=C:\airam-repo\games\Offenssive-Strike\offensive-combat-reload

# Pastas FORA do repositório: .env.prd/.env.hml (segredos gerados no 1º uso),
# credentials.json, cloudflared.yml, historico.json e backups\.
# Vazio = %USERPROFILE%\.offensive-prd e %USERPROFILE%\.offensive-hml
PRD_DIR=
HML_DIR=

# Só no primeiro uso (sem historico.json): a versão em que a produção sobe.
# Vazio = a última versão final.
VERSAO_INICIAL=

# De quanto em quanto tempo procurar versão nova (git ls-remote --tags).
VERIFICAR_MINUTOS=10

DOMINIO=trybest.com.br

# Admin do jogo, criado no primeiro boot de cada banco (a senha é gerada no .env).
ADMIN_EMAIL=gregorygdtorres@gmail.com
